[package]
name = "sf-engine"
version = "0.1.0"
edition = "2021"
description = "Shatterforge engine: adaptive real-size bricks, structural solver (at rest and dynamic), break plans, meshes"
build = "build.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
hashbrown = "0.15"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sf_engine)'] }
