[package]
name = "sf-engine"
version = "0.1.0"
edition = "2021"
description = "Shatterforge engine: adaptive real-size bricks, box rigid bodies, structural solver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hashbrown = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", features = ["global"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.test]
opt-level = 3
